<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>udemy-studio · Mã truy cập</title>
<style>
  body { font: 16px/1.5 system-ui, -apple-system, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; }
  form { display: grid; gap: 12px; width: min(320px, 90vw); }
  input, button { font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid #8884; }
  button { cursor: pointer; }
</style>
</head>
<body>
<form method="get">
  <h1>udemy-studio</h1>
  <p>Nhập mã truy cập hiện trong terminal của máy chạy server, hoặc quét mã QR.</p>
  <input name="code" autocomplete="one-time-code" autocapitalize="characters" required autofocus>
  <button type="submit">Vào thư viện</button>
</form>
</body>
</html>
