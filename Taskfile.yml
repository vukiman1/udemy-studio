version: "3"

vars:
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  BINARY: bin/udemy-studio

tasks:
  default:
    cmds:
      - task --list

  install:
    desc: Install frontend dependencies
    dir: web
    cmds:
      - pnpm install --frozen-lockfile

  gen:
    desc: Regenerate code from api/openapi.yaml
    cmds:
      - task: gen:api

  gen:api:
    cmds:
      - go generate ./internal/transport/httpapi/gen
      - pnpm --dir web gen:api

  lint:
    desc: Lint Go and web
    cmds:
      - task: lint:go
      - task: lint:web

  lint:go:
    cmds:
      - go tool golangci-lint run ./...

  lint:web:
    dir: web
    cmds:
      - pnpm lint

  test:
    desc: Run Go and web tests
    cmds:
      - task: test:go
      - task: test:web

  test:go:
    cmds:
      - go test -race ./...

  test:web:
    dir: web
    cmds:
      - pnpm test

  test:oracle:
    desc: Compare Go parsers against the Python oracle on the real library
    requires:
      vars: [LIBRARY_DIR]
    cmds:
      - LIBRARY_DIR="{{.LIBRARY_DIR}}" go test ./internal/subtitle/ -run Pysrt -count=1

  test:s3:
    desc: Run the S3 bucket adapter against a throwaway SeaweedFS in Docker
    vars:
      S3_CONTAINER: udemy-studio-s3-test
      S3_ADDRESS: 127.0.0.1:8333
      S3_BUCKET: studio-test
      S3_CONFIG: "{{.ROOT_DIR}}/internal/adapter/s3bucket/testdata/seaweedfs-s3.json"
    cmds:
      - docker run -d --rm --name {{.S3_CONTAINER}} -p {{.S3_ADDRESS}}:8333 -v "{{.S3_CONFIG}}:/etc/seaweedfs/s3.json:ro" chrislusf/seaweedfs server -s3 -s3.config=/etc/seaweedfs/s3.json
      - defer: docker stop {{.S3_CONTAINER}}
      - curl -s --retry 30 --retry-delay 1 --retry-all-errors -o /dev/null http://{{.S3_ADDRESS}}/
      - echo "s3.bucket.create -name {{.S3_BUCKET}}" | docker exec -i {{.S3_CONTAINER}} weed shell
      - >-
        UDEMY_STUDIO_TEST_S3_URL=http://{{.S3_ADDRESS}}/{{.S3_BUCKET}}
        UDEMY_STUDIO_TEST_S3_KEY_ID=studio-writer
        UDEMY_STUDIO_TEST_S3_SECRET=studio-writer-secret
        UDEMY_STUDIO_TEST_S3_READER_KEY_ID=studio-reader
        UDEMY_STUDIO_TEST_S3_READER_SECRET=studio-reader-secret
        go test ./internal/adapter/s3bucket/ -count=1 -v

  build:web:
    dir: web
    cmds:
      - pnpm build
      - touch dist/.gitkeep

  build:
    desc: Build the single binary with the embedded frontend
    deps: [build:web]
    cmds:
      - go build -trimpath -ldflags "-s -w -X main.version={{.VERSION}}" -o {{.BINARY}} ./cmd/udemy-studio

  check:
    desc: gen + lint + test + build, the gate every change passes
    cmds:
      - task: gen
      - task: lint
      - task: test
      - task: build

  vuln:
    desc: Scan dependencies for reachable vulnerabilities
    cmds:
      - go tool govulncheck ./...

  dev:
    desc: Go server with hot reload plus the Vite dev server (LIBRARY_DIR=<downloads dir>)
    deps: [dev:go, dev:web]

  dev:go:
    requires:
      vars: [LIBRARY_DIR]
    env:
      UDEMY_STUDIO_LIBRARY: "{{.LIBRARY_DIR}}"
    cmds:
      - go tool air

  dev:web:
    dir: web
    cmds:
      - pnpm dev

  fixtures:udemy:
    desc: Sanitize the Python oracle's saved/ curriculum and temp/ HLS masters into testdata/
    requires:
      vars: [PYTHON_REPO, PORTAL]
    cmds:
      - go run ./tools/sanitizefixture -in "{{.PYTHON_REPO}}/saved" -hls-in "{{.PYTHON_REPO}}/temp" -portal "{{.PORTAL}}"

  fixtures:plan:
    desc: Record the Python downloader's plan and HLS variants for each curriculum fixture
    requires:
      vars: [PYTHON_REPO]
    env:
      PYTHONPATH: "{{.PYTHON_REPO}}"
    cmds:
      - for: [course, edge_course]
        cmd: >-
          "{{.PYTHON_REPO}}/.venv/bin/python" tools/pyplangolden/plan_golden.py
          testdata/udemy/python/{{.ITEM}}_content.json testdata/udemy/hls
          testdata/udemy/plan/{{.ITEM | replace "course" "plan"}}_golden.json
          testdata/udemy/plan/{{.ITEM | replace "course" "hls"}}_golden.json

  fixtures:naming:
    desc: Record pathvalidate and demoji output for every real title plus edge cases
    requires:
      vars: [PYTHON_REPO]
    cmds:
      - >-
        "{{.PYTHON_REPO}}/.venv/bin/python" tools/pynaminggolden/naming_golden.py
        testdata/udemy/python/course_content.json internal/naming/emoji_codes.json testdata/naming/naming_golden.json

  fixtures:vtt:
    desc: Record VTT fixtures, the SRT the Python downloader converts each to, and Python's HTML unescape tables
    requires:
      vars: [PYTHON_REPO]
    env:
      PYTHONPATH: "{{.PYTHON_REPO}}"
    cmds:
      - '"{{.PYTHON_REPO}}/.venv/bin/python" tools/pyvttgolden/vtt_golden.py testdata/subtitle/vtt internal/subtitle/html_entities.json'

  fixtures:quiz:
    desc: Record Python's json.dumps output and the quiz pages the Python downloader writes for each quiz fixture
    requires:
      vars: [PYTHON_REPO]
    env:
      PYTHONPATH: "{{.PYTHON_REPO}}"
    cmds:
      - '"{{.PYTHON_REPO}}/.venv/bin/python" tools/pyquizgolden/quiz_golden.py testdata/pyjson/dumps_golden.json testdata/quiz'

  fixtures:subtitles:
    desc: Record pysrt digests of every SRT in a downloads/ tree
    requires:
      vars: [LIBRARY_DIR, PYTHON]
    cmds:
      - '"{{.PYTHON}}" tools/pysrtgolden/pysrt_golden.py "{{.LIBRARY_DIR}}" testdata/subtitle/pysrt_golden.json'

  fixtures:library:
    desc: Describe a downloads/ tree into testdata/library/manifest.json
    requires:
      vars: [LIBRARY_DIR]
    cmds:
      - go run ./tools/librarymanifest -root "{{.LIBRARY_DIR}}"
