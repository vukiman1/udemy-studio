services:
  udemy-studio:
    # GitHub builds this image on every merge to main: `docker compose pull` fetches it, `--build` builds this checkout.
    image: ghcr.io/vukiman1/udemy-studio:latest
    build: .
    ports:
      # Reachable from this machine only; for other devices publish the port and add --lan to the command.
      - "127.0.0.1:8765:8765"
    volumes:
      # A mistyped LIBRARY_DIR fails to start rather than serving a new empty folder.
      - type: bind
        source: ${LIBRARY_DIR:?set LIBRARY_DIR to the folder of downloaded courses}
        target: /library
        bind:
          create_host_path: false
      # Database and the key sealing saved tokens and API keys: back this folder up, never commit it.
      - ${DATA_DIR:-./data}:/data
    environment:
      # The tunnel's hostname, such as studio.example.com; the app refuses hostnames it was not told about.
      UDEMY_STUDIO_PUBLIC_HOST: ${PUBLIC_HOST:-}
    restart: unless-stopped

  # Runs only with COMPOSE_PROFILES=tunnel. Point the tunnel's public hostname at http://udemy-studio:8765 and put a
  # Cloudflare Access policy in front: the app has no login of its own.
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - udemy-studio
    restart: unless-stopped
    profiles: [tunnel]
