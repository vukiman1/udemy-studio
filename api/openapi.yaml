openapi: 3.0.3
info:
  title: udemy-studio
  version: 0.1.0
tags:
  - name: raw
    description: Byte-serving routes written by hand around http.ServeContent; excluded from Go codegen.
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness probe and build version
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /api/courses:
    get:
      operationId: listCourses
      summary: Courses in the library with completion and where to resume
      responses:
        "200":
          description: Courses ordered by folder name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CourseSummary"

  /api/courses/{courseId}:
    get:
      operationId: getCourse
      summary: Chapter and lecture tree with per-lecture progress
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "200":
          description: The course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/continue:
    get:
      operationId: getContinue
      summary: The lecture to open for "continue learning"
      responses:
        "200":
          description: Most recently watched unfinished lecture, or the one after a finished lecture
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContinueTarget"
        "204":
          description: Nothing to continue yet

  /api/history:
    get:
      operationId: listHistory
      summary: The lectures most recently watched, newest first
      responses:
        "200":
          description: Watched lectures still in the library, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HistoryEntry"

  /api/search:
    get:
      operationId: searchSubtitles
      summary: Find the moments a phrase is said in any lecture, diacritics ignored and the last word matched as a prefix
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Matching cues, best first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchHit"

  /api/lectures/{lectureId}/cues:
    get:
      operationId: getLectureCues
      summary: Subtitle cues merged by timing for the bilingual overlay
      parameters:
        - $ref: "#/components/parameters/LectureId"
        - $ref: "#/components/parameters/Languages"
      responses:
        "200":
          description: Cues ordered by start time
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Cue"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/lectures/{lectureId}/subtitles.vtt:
    get:
      operationId: getLectureSubtitlesVtt
      summary: WebVTT with one line per language, for the native iOS fullscreen player
      parameters:
        - $ref: "#/components/parameters/LectureId"
        - $ref: "#/components/parameters/Languages"
      responses:
        "200":
          description: WebVTT document
          content:
            text/vtt:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"

  /api/lectures/{lectureId}/progress:
    put:
      operationId: putLectureProgress
      summary: Save the playback position and completion of a lecture
      parameters:
        - $ref: "#/components/parameters/LectureId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressReport"
      responses:
        "200":
          description: Stored progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LectureProgress"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/lectures/{lectureId}/notes:
    get:
      operationId: listLectureNotes
      summary: The notes written on a lecture, in playback order
      parameters:
        - $ref: "#/components/parameters/LectureId"
      responses:
        "200":
          description: Notes, earliest moment first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Note"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: addLectureNote
      summary: Write a note at a moment of a lecture
      parameters:
        - $ref: "#/components/parameters/LectureId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteDraft"
      responses:
        "201":
          description: The stored note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/notes/{noteId}:
    patch:
      operationId: editNote
      summary: Rewrite a note; its moment stays
      parameters:
        - $ref: "#/components/parameters/NoteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteEdit"
      responses:
        "200":
          description: The stored note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteNote
      summary: Delete a note
      parameters:
        - $ref: "#/components/parameters/NoteId"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /api/courses/{courseId}/notes.md:
    get:
      operationId: exportCourseNotes
      summary: Every note of a course as a Markdown file, in course order
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "200":
          description: Markdown document, sent as a download
          headers:
            Content-Disposition:
              required: true
              schema:
                type: string
          content:
            text/markdown; charset=utf-8:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"

  /api/library/tools:
    get:
      operationId: listCourseTools
      summary: What is left to translate and compress in every course, with the runs in progress
      responses:
        "200":
          description: One entry per course
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CourseTools"

  /api/courses/{courseId}/compression/plan:
    get:
      operationId: planCourseCompression
      summary: What compressing a course to H.265 would encode, and roughly how long it takes
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "200":
          description: The videos that would be encoded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompressionPlan"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CompressionUnavailable"

  /api/courses/{courseId}/compression:
    get:
      operationId: getCourseCompression
      summary: The latest compression of a course since the server started
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "200":
          description: The compression run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompressionRun"
        "204":
          description: The course has not been compressed since the server started
        "503":
          $ref: "#/components/responses/CompressionUnavailable"
    post:
      operationId: startCourseCompression
      summary: Queue a course to have its H.264 videos re-encoded to H.265 in the background
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompressionRun"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/CompressionUnavailable"
    delete:
      operationId: cancelCourseCompression
      summary: Stop compressing a course; videos already compressed stay compressed
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "204":
          description: Cancelled
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/CompressionUnavailable"

  /api/ai/providers:
    get:
      operationId: listAIProviders
      summary: The AI providers the app can use, with the models it knows and recommends for each
      responses:
        "200":
          description: Providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AIProvider"

  /api/ai/settings:
    get:
      operationId: getAISettings
      summary: The saved AI configuration; the key itself is never sent back
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AISettings"
    put:
      operationId: saveAISettings
      summary: Save and turn on an AI configuration; a new key is checked with the provider first
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AISettingsDraft"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AISettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/ProviderUnreachable"

  /api/ai/settings/providers/{provider}:
    delete:
      operationId: forgetAIProvider
      summary: Forget one provider's key and models; forgetting the provider in use leaves none in use
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/AIProviderId"
      responses:
        "204":
          description: Forgotten

  /api/ai/settings/enabled:
    put:
      operationId: setAIEnabled
      summary: Stop or resume using the saved AI configuration without forgetting it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIEnabled"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AISettings"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/ai/check:
    post:
      operationId: checkAI
      summary: Call the provider's model with a tiny prompt and time the answer; an empty key uses the saved one
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AICheckRequest"
      responses:
        "200":
          description: The model answered with the key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AICheck"
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/ProviderUnreachable"

  /api/storage:
    get:
      operationId: getStorageSettings
      summary: The saved cloud storage connection; the secret key is never sent back
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageSettings"
    put:
      operationId: saveStorageSettings
      summary: Save a cloud storage connection once the bucket has answered with its keys
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageDraft"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/ProviderUnreachable"
    delete:
      operationId: forgetStorageSettings
      summary: Forget the cloud storage connection and its keys
      responses:
        "204":
          description: Forgotten

  /api/storage/check:
    post:
      operationId: checkStorage
      summary: Read and write a tiny object to learn what the keys may do; empty keys use the saved ones
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageDraft"
      responses:
        "200":
          description: The bucket answered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageCheck"
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/ProviderUnreachable"


  /api/courses/{courseId}/publish/plan:
    get:
      operationId: planCoursePublish
      summary: What publishing a course to cloud storage would send, and what it would replace
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "200":
          description: Plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishPlan"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/ProviderUnreachable"

  /api/courses/{courseId}/publish:
    post:
      operationId: startCoursePublish
      summary: Publish chosen chapters of a course to cloud storage, replacing what is there
      parameters:
        - $ref: "#/components/parameters/CourseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishRequest"
      responses:
        "202":
          description: Started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/ProviderUnreachable"

  /api/publish:
    get:
      operationId: getPublishRun
      summary: The latest publish since the server started
      responses:
        "200":
          description: The publish run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishRun"
        "204":
          description: Nothing published since the server started
    delete:
      operationId: cancelPublish
      summary: Stop the running publish; the course already in the bucket stays listed
      responses:
        "204":
          description: Stopping
        "409":
          $ref: "#/components/responses/Conflict"

  /api/publish/published:
    get:
      operationId: getPublishedCourse
      summary: The course the cloud storage index lists, if storage is set up and holds one
      responses:
        "200":
          description: Published course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishedCourse"
        "204":
          description: No storage is set up or it holds no course
        "502":
          $ref: "#/components/responses/ProviderUnreachable"

  /api/courses/{courseId}/translation/plan:
    get:
      operationId: planCourseTranslation
      summary: Which lectures would get Vietnamese subtitles, and roughly what it costs with the configured AI
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "200":
          description: The lectures that would be translated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranslationPlan"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/courses/{courseId}/translation:
    get:
      operationId: getCourseTranslation
      summary: The latest translation of a course since the server started
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "200":
          description: The translation run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranslationRun"
        "204":
          description: The course has not been translated since the server started
    post:
      operationId: startCourseTranslation
      summary: Queue a course to have its English subtitles translated into Vietnamese in the background
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranslationRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: cancelCourseTranslation
      summary: Stop translating a course; lectures already translated keep their subtitles
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "204":
          description: Cancelled
        "409":
          $ref: "#/components/responses/Conflict"

  /media/{lectureId}:
    get:
      tags: [raw]
      operationId: getLectureVideo
      summary: Lecture video with Range support for seeking
      parameters:
        - $ref: "#/components/parameters/LectureId"
      responses:
        "200":
          description: Whole file
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "206":
          description: Requested byte range
        "404":
          $ref: "#/components/responses/NotFound"

  /articles/{lectureId}:
    get:
      tags: [raw]
      operationId: getLectureArticle
      summary: Downloaded article HTML, served with a sandbox CSP for iframe display
      parameters:
        - $ref: "#/components/parameters/LectureId"
      responses:
        "200":
          description: Article document
          content:
            text/html:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"

  /attachments/{attachmentId}:
    get:
      tags: [raw]
      operationId: getAttachment
      summary: Lecture attachment download (slides, source code, PDFs)
      parameters:
        - name: attachmentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: File bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"

  /api/downloads/profiles:
    get:
      operationId: listChromeProfiles
      summary: Chrome profiles and the Udemy portals each one is logged in to
      responses:
        "200":
          description: Profiles ordered by directory
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChromeProfile"
        "503":
          $ref: "#/components/responses/DownloadsUnavailable"

  /api/downloads/profile:
    put:
      operationId: selectChromeProfile
      summary: Choose the Chrome profile whose Udemy login downloads use
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileSelection"
      responses:
        "204":
          description: Profile selected
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/DownloadsUnavailable"

  /api/downloads/status:
    get:
      operationId: getLoginStatus
      summary: Selected profile and whether its Udemy logins are still valid
      responses:
        "200":
          description: Login status; problem explains what to fix when nothing can be downloaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginStatus"
        "503":
          $ref: "#/components/responses/DownloadsUnavailable"

  /api/downloads/tokens:
    get:
      operationId: listPastedLogins
      summary: Udemy tokens pasted by hand, one per portal; the tokens themselves never leave the server
      responses:
        "200":
          description: Pasted logins
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PastedLogin"
        "503":
          $ref: "#/components/responses/DownloadsUnavailable"
    put:
      operationId: savePastedLogin
      summary: Check a pasted access_token with its portal and use it for downloads from there
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PastedLoginDraft"
      responses:
        "200":
          description: The portal accepted the token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PastedLogin"
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/ProviderUnreachable"
        "503":
          $ref: "#/components/responses/DownloadsUnavailable"

  /api/downloads/tokens/{host}:
    delete:
      operationId: forgetPastedLogin
      summary: Forget the token pasted for a portal
      parameters:
        - name: host
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Forgotten
        "503":
          $ref: "#/components/responses/DownloadsUnavailable"

  /api/jobs:
    get:
      operationId: listJobs
      summary: Download jobs, newest first
      responses:
        "200":
          description: Jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
        "503":
          $ref: "#/components/responses/DownloadsUnavailable"
    post:
      operationId: createJob
      summary: Queue a course download
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobRequest"
      responses:
        "202":
          description: Job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/DownloadsUnavailable"

  /api/jobs/{jobId}:
    delete:
      operationId: cancelJob
      summary: Cancel a queued or running job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Cancellation requested
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/DownloadsUnavailable"

  /api/events:
    get:
      tags: [raw]
      operationId: streamEvents
      summary: Server-Sent Events; each "job" event carries a full Job
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string

components:
  parameters:
    CourseId:
      name: courseId
      in: path
      required: true
      schema:
        type: string
    LectureId:
      name: lectureId
      in: path
      required: true
      schema:
        type: string
    NoteId:
      name: noteId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Languages:
      name: langs
      in: query
      required: false
      description: Subtitle languages in display order; all available languages when omitted
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string

  responses:
    DownloadsUnavailable:
      description: yt-dlp or aria2c could not be found when the server started
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    CompressionUnavailable:
      description: ffmpeg or ffprobe was not found when the server started
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ProviderUnreachable:
      description: An outside service, such as the AI provider or Udemy, could not be reached
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The request conflicts with the current state
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: No such course, lecture or attachment
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadRequest:
      description: The request failed validation
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Health:
      type: object
      required: [status, version, role]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
        role:
          type: string
          enum: [library, cloud]
          description: library holds the downloaded courses; cloud only reads the course published to cloud storage

    Problem:
      description: RFC 9457 problem details
      type: object
      required: [title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string

    CourseSummary:
      type: object
      required: [id, title, playableLectures, completedLectures, sizeBytes]
      properties:
        id:
          type: string
        title:
          type: string
        playableLectures:
          type: integer
        completedLectures:
          type: integer
        sizeBytes:
          type: integer
          format: int64
          description: Every file in the course's folder, measured when asked
        coverUrl:
          type: string
          description: Where the course's cover image is served; absent when it was downloaded without one
        resume:
          $ref: "#/components/schemas/ContinueTarget"

    CourseDetail:
      allOf:
        - $ref: "#/components/schemas/CourseSummary"
        - type: object
          required: [chapters]
          properties:
            chapters:
              type: array
              items:
                $ref: "#/components/schemas/Chapter"

    Chapter:
      type: object
      required: [index, title, lectures]
      properties:
        index:
          type: integer
        title:
          type: string
        lectures:
          type: array
          items:
            $ref: "#/components/schemas/LectureSummary"

    LectureKind:
      type: string
      enum: [video, article, quiz, unavailable]

    LectureSummary:
      type: object
      required: [id, number, title, kind, hasVideo, hasArticle, subtitleLanguages, attachments]
      properties:
        id:
          type: string
        number:
          type: integer
        title:
          type: string
        kind:
          $ref: "#/components/schemas/LectureKind"
        hasVideo:
          type: boolean
        hasArticle:
          type: boolean
        subtitleLanguages:
          type: array
          items:
            type: string
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"
        progress:
          $ref: "#/components/schemas/LectureProgress"

    Attachment:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string

    LectureProgress:
      type: object
      required: [positionSeconds, durationSeconds, completed, updatedAt]
      properties:
        positionSeconds:
          type: number
          format: double
        durationSeconds:
          type: number
          format: double
        completed:
          type: boolean
        updatedAt:
          type: string
          format: date-time

    ProgressReport:
      type: object
      required: [positionSeconds, durationSeconds, completed]
      properties:
        positionSeconds:
          type: number
          format: double
        durationSeconds:
          type: number
          format: double
        completed:
          type: boolean

    ContinueTarget:
      type: object
      required: [courseId, lectureId, positionSeconds]
      properties:
        courseId:
          type: string
        lectureId:
          type: string
        positionSeconds:
          type: number
          format: double

    HistoryEntry:
      type: object
      required: [courseId, courseTitle, lectureId, lectureTitle, positionSeconds, completed, updatedAt]
      properties:
        courseId:
          type: string
        courseTitle:
          type: string
        lectureId:
          type: string
        lectureTitle:
          type: string
        positionSeconds:
          type: number
          format: double
        completed:
          type: boolean
        updatedAt:
          type: string
          format: date-time

    Note:
      type: object
      required: [id, atSeconds, body, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        atSeconds:
          type: number
          format: double
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    NoteDraft:
      type: object
      required: [atSeconds, body]
      properties:
        atSeconds:
          type: number
          format: double
          description: The moment of the video the note is about; 0 for lectures without video
        body:
          type: string

    NoteEdit:
      type: object
      required: [body]
      properties:
        body:
          type: string

    CourseTools:
      type: object
      required: [courseId, translation]
      properties:
        courseId:
          type: string
        translation:
          $ref: "#/components/schemas/TranslationTools"
        compression:
          $ref: "#/components/schemas/CompressionTools"

    TranslationTools:
      type: object
      required: [lectures, pending]
      properties:
        lectures:
          type: integer
          description: Lectures with English subtitles
        pending:
          type: integer
          description: Those of them still without Vietnamese subtitles
        run:
          $ref: "#/components/schemas/TranslationRun"

    CompressionTools:
      type: object
      required: [videos, pending, unchecked]
      properties:
        videos:
          type: integer
        pending:
          type: integer
          description: H.264 videos still to compress, among those already read
        unchecked:
          type: integer
          description: Videos not read yet, so pending may grow
        run:
          $ref: "#/components/schemas/CompressionRun"

    CompressionPlan:
      type: object
      required: [files, totalBytes, totalSeconds, estimatedSeconds, alreadyHevc, otherCodec, notWorthIt, unreadable]
      properties:
        files:
          type: integer
          description: H.264 videos that would be encoded
        totalBytes:
          type: integer
          format: int64
        totalSeconds:
          type: number
          format: double
        estimatedSeconds:
          type: number
          format: double
          description: Rough encode time on this machine
        alreadyHevc:
          type: integer
        otherCodec:
          type: integer
          description: Videos in neither H.264 nor H.265, left as they are
        notWorthIt:
          type: integer
          description: Videos an earlier run found not worth re-encoding
        unreadable:
          type: integer
          description: Videos ffprobe cannot read, such as an unfinished download

    CompressionRun:
      type: object
      required: [state, total, finished, bytesBefore, bytesAfter, skipped, failed]
      properties:
        state:
          type: string
          enum: [queued, running, done, cancelled]
        total:
          type: integer
        finished:
          type: integer
        current:
          $ref: "#/components/schemas/CompressionCurrent"
        bytesBefore:
          type: integer
          format: int64
          description: Size of the videos replaced so far, before compression
        bytesAfter:
          type: integer
          format: int64
        skipped:
          type: array
          items:
            $ref: "#/components/schemas/CompressionOutcome"
        failed:
          type: array
          items:
            $ref: "#/components/schemas/CompressionOutcome"

    CompressionCurrent:
      type: object
      required: [lectureTitle, encodedSeconds, lengthSeconds]
      properties:
        lectureTitle:
          type: string
        encodedSeconds:
          type: number
          format: double
        lengthSeconds:
          type: number
          format: double

    CompressionOutcome:
      type: object
      required: [path, lectureTitle, reason]
      properties:
        path:
          type: string
          description: The video's path in the library
        lectureTitle:
          type: string
        reason:
          type: string

    AIProvider:
      type: object
      required: [id, label, model, inputUsdPerMillion, outputUsdPerMillion]
      properties:
        id:
          $ref: "#/components/schemas/AIProviderId"
        label:
          type: string
        model:
          $ref: "#/components/schemas/AIModel"
        inputUsdPerMillion:
          type: number
          format: double
        outputUsdPerMillion:
          type: number
          format: double

    AIProviderId:
      type: string
      enum: [claude, openai]

    AIModel:
      type: object
      required: [id, label]
      properties:
        id:
          type: string
        label:
          type: string

    AISettings:
      type: object
      required: [configured, enabled, providers]
      properties:
        configured:
          type: boolean
          description: Whether a provider is chosen to be used
        provider:
          $ref: "#/components/schemas/AIProviderId"
        enabled:
          type: boolean
        providers:
          type: array
          description: Every provider with a saved key, whether in use or not
          items:
            $ref: "#/components/schemas/AISavedProvider"

    AISavedProvider:
      type: object
      required: [provider, keyHint]
      properties:
        provider:
          $ref: "#/components/schemas/AIProviderId"
        keyHint:
          type: string
          description: The key's first and last four characters, the rest masked

    AISettingsDraft:
      type: object
      required: [provider]
      properties:
        provider:
          $ref: "#/components/schemas/AIProviderId"
        apiKey:
          type: string
          description: A new key; leave out to keep the saved key of the same provider

    AIEnabled:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean

    AICheckRequest:
      type: object
      required: [provider]
      properties:
        provider:
          $ref: "#/components/schemas/AIProviderId"
        apiKey:
          type: string

    AICheck:
      type: object
      required: [latencyMs, reply]
      properties:
        latencyMs:
          type: integer
          format: int64
        reply:
          type: string

    StorageSettings:
      type: object
      required: [configured]
      properties:
        configured:
          type: boolean
        url:
          type: string
          description: The S3 API URL, bucket included
        accessKeyIdHint:
          type: string
          description: The access key ID's first and last four characters, the rest masked

    StorageDraft:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: The S3 API URL, such as https://<account-id>.r2.cloudflarestorage.com/<bucket>
        accessKeyId:
          type: string
          description: Leave out with the secret to keep the saved keys
        secretAccessKey:
          type: string

    StorageAccess:
      type: string
      enum: [read-only, read-write]

    StorageCheck:
      type: object
      required: [access, hasCourse]
      properties:
        access:
          $ref: "#/components/schemas/StorageAccess"
        hasCourse:
          type: boolean
          description: Whether the bucket already holds a published course index


    PublishedCourse:
      type: object
      required: [dir, title, sizeBytes, publishedAt, chapters, totalChapters]
      properties:
        chapters:
          type: integer
          description: Chapters in the bucket
        totalChapters:
          type: integer
          description: Chapters the course had when published; 0 when the index predates chapter selection
        courseId:
          type: string
          description: The library course in the same folder, when this library has it
        dir:
          type: string
        title:
          type: string
        sizeBytes:
          type: integer
          format: int64
        publishedAt:
          type: string
          format: date-time

    PublishRequest:
      type: object
      required: [chapters]
      properties:
        chapters:
          type: array
          description: Chapter folders to publish; anything else of the course in the bucket is removed
          items:
            type: string

    PublishChapter:
      type: object
      required: [dir, files, sizeBytes, published]
      properties:
        dir:
          type: string
        files:
          type: integer
        sizeBytes:
          type: integer
          format: int64
        published:
          type: boolean

    PublishPlan:
      type: object
      required: [sharedBytes, limitBytes, chapters, replaces]
      properties:
        sharedBytes:
          type: integer
          format: int64
          description: Files outside chapter folders, such as the cover, sent with any chapter
        limitBytes:
          type: integer
          format: int64
        chapters:
          type: array
          items:
            $ref: "#/components/schemas/PublishChapter"
        replaces:
          type: boolean
          description: Whether another course in the bucket will be removed first
        published:
          $ref: "#/components/schemas/PublishedCourse"

    PublishRun:
      type: object
      required: [courseId, title, state, totalFiles, sentFiles, skippedFiles, totalBytes, sentBytes]
      properties:
        courseId:
          type: string
        title:
          type: string
        state:
          type: string
          enum: [running, done, failed, cancelled]
        totalFiles:
          type: integer
        sentFiles:
          type: integer
        skippedFiles:
          type: integer
          description: Files already in the bucket, unchanged since they were sent
        totalBytes:
          type: integer
          format: int64
        sentBytes:
          type: integer
          format: int64
          description: Bytes of the files sent or skipped so far
        currentFile:
          type: string
        failure:
          type: string

    TranslationPlan:
      type: object
      required: [lectures, alreadyTranslated, characters, estimatedUsd]
      properties:
        lectures:
          type: integer
          description: Lectures with English subtitles and no Vietnamese ones
        alreadyTranslated:
          type: integer
        characters:
          type: integer
        estimatedUsd:
          type: number
          format: double
          description: Rough cost, measured from earlier translations

    TranslationRun:
      type: object
      required: [state, total, finished, costUsd, failed]
      properties:
        state:
          type: string
          enum: [queued, running, done, cancelled, failed]
        total:
          type: integer
        finished:
          type: integer
        currentLecture:
          type: string
        costUsd:
          type: number
          format: double
          description: What the run has spent so far, from the provider's token counts
        failed:
          type: array
          items:
            $ref: "#/components/schemas/TranslationOutcome"
        error:
          type: string
          description: Why the whole run stopped, such as a rejected API key

    TranslationOutcome:
      type: object
      required: [path, lectureTitle, reason]
      properties:
        path:
          type: string
        lectureTitle:
          type: string
        reason:
          type: string

    SearchHit:
      type: object
      required: [courseId, courseTitle, lectureId, lectureTitle, language, startMs, snippet]
      properties:
        courseId:
          type: string
        courseTitle:
          type: string
        lectureId:
          type: string
        lectureTitle:
          type: string
        language:
          type: string
        startMs:
          type: integer
          format: int64
        snippet:
          type: string
          description: The cue around the match; each match sits between U+E000 and U+E001

    Cue:
      type: object
      required: [startMs, endMs, lines]
      properties:
        startMs:
          type: integer
        endMs:
          type: integer
        lines:
          type: array
          items:
            $ref: "#/components/schemas/CueLine"

    CueLine:
      type: object
      required: [language, text]
      properties:
        language:
          type: string
        text:
          type: string

    PastedLogin:
      type: object
      required: [host, userName, savedAt]
      properties:
        host:
          type: string
        userName:
          type: string
          description: The account the token logs in as, as the portal names it
        savedAt:
          type: string
          format: date-time

    PastedLoginDraft:
      type: object
      required: [host, token]
      properties:
        host:
          type: string
          description: The portal's host, or any URL on it
        token:
          type: string
          description: The value of the access_token cookie

    ChromeProfile:
      type: object
      required: [dir, name, udemyHosts, selected]
      properties:
        dir:
          type: string
        name:
          type: string
        udemyHosts:
          type: array
          items:
            type: string
        selected:
          type: boolean

    ProfileSelection:
      type: object
      required: [dir]
      properties:
        dir:
          type: string

    LoginStatus:
      type: object
      required: [hosts]
      properties:
        profile:
          $ref: "#/components/schemas/ChromeProfile"
        hosts:
          type: array
          items:
            $ref: "#/components/schemas/HostLogin"
        problem:
          type: string

    HostLogin:
      type: object
      required: [host, isExpired]
      properties:
        host:
          type: string
        expiresAt:
          type: string
          format: date-time
        isExpired:
          type: boolean

    JobRequest:
      type: object
      required: [courseUrl]
      properties:
        courseUrl:
          type: string
        chapters:
          type: string

    JobStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]

    Job:
      type: object
      required: [id, courseUrl, status, createdAt, progress, failures]
      properties:
        id:
          type: string
        courseUrl:
          type: string
        chapters:
          type: string
        status:
          $ref: "#/components/schemas/JobStatus"
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        progress:
          $ref: "#/components/schemas/JobProgress"
        failures:
          type: array
          items:
            type: string
        error:
          type: string
        errorKind:
          $ref: "#/components/schemas/JobErrorKind"

    JobErrorKind:
      type: string
      enum: [login, course_not_found, blocked, chrome_access, interrupted, other]

    JobProgress:
      type: object
      required: [courseTitle, totalLectures, finishedCount]
      properties:
        courseTitle:
          type: string
        totalLectures:
          type: integer
        finishedCount:
          type: integer
        currentLecture:
          type: string
